name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - name: Compute sha256
        id: sha
        run: |
          cd app/build/outputs/apk/debug
          echo "sha256=$(sha256sum app-debug.apk | awk '{print $1}')" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Concordance ${{ github.ref_name }}

            SHA-256: ${{ steps.sha.outputs.sha256 }}
            See RELEASE_NOTES.md for details.
      - name: Upload release metadata to Supabase (optional)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Wire this step to upsert app_releases via the Supabase REST API."
