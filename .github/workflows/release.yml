name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # JDK 21 for the Robolectric test JVM (see the toolchain block in
      # app/build.gradle.kts). `gradle.properties` no longer pins
      # `org.gradle.java.home`, so the JDK is selected here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # The release build signs with the upload key. A tag must never produce
      # a debug-signed APK: Android would reject it as an update to an
      # installed release build.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Add the release keystore as a repository secret."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # Gates: a tag is only allowed to produce an artifact if the unit tests
      # and Android Lint are green.
      - name: Unit tests (Robolectric + MockWebServer)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Package release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="app/build/outputs/apk/release"
          cp "$OUT/app-release.apk" "Concordance-v${VERSION}.apk"
          sha256sum "Concordance-v${VERSION}.apk" | tee "Concordance-v${VERSION}.apk.sha256"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "Concordance-v${VERSION}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Concordance-v*.apk
            Concordance-v*.apk.sha256
          body_path: RELEASE_NOTES.md
